[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randomness-contextuality-lp"
version = "0.1.0"
description = "Tools for exploring randomness quantification in contextuality scenarios via linear programming."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Randomness Winter School 2026" }
]
dependencies = [
  "numpy>=2.2.6",
  "mosek>=11.2.0",
  "scipy>=1.15.3",
  "pycddlib>=3.0.2",
  "sympy>=1.14.0",
  "methodtools>=0.4.7",
  "numba>=0.65.1",
  "networkx>=3.4.2",
  "tqdm>=4.67.3",
  "cvxpy>=1.7.5",
  "pytest>=9.0.3",
  "gurobipy>=13.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contextualityqkd*"]
